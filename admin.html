<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfaz Admin</title>
    <!-- Tambahkan ikon -->
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <!-- Jika menggunakan format PNG -->
    <link rel="icon" href="Source/logo.png" type="image/png">
    <link rel="stylesheet" href="admin-SECRET/css/admin-style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700;800&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body id="top">
    <header class="header">
        <div class="header-bottom skewBg" data-header>
            <div class="container">
                <a href="#" class="logo" data-aos="zoom-in" data-aos-duration="1000" >Alfaz Team</a>
                <nav class="navbar" data-navbar>
                    <ul class="navbar-list">
                        <li class="navbar-item" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="100">
                            <a href="/admin-SECRET/html/admin-booking.html" class="navbar-link skewBg" data-nav-link>Admin Booking</a>
                        </li>
                        <li class="navbar-item" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="300">
                            <a href="admin-SECRET/html/admin-galleries.html" class="navbar-link skewBg" data-nav-link>Admin Galleries</a>
                        </li>
                        <li class="navbar-item" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="400">
                            <a href="HTML/admin-media.html" class="navbar-link skewBg" data-nav-link>Admin Cart</a>
                        </li>
                    </ul>
                </nav>
                <div class="header-actions">
                    <button class="cart-btn" aria-label="cart" data-aos="fade-left" data-aos-duration="1000" data-aos-delay="700">
                        <ion-icon name="cart"></ion-icon>
                        <span class="cart-badge">0</span>
                    </button>
                    <button class="nav-toggle-btn" aria-label="toggle menu" data-nav-toggler>
                        <ion-icon name="menu-outline" class="menu"></ion-icon>
                        <ion-icon name="close-outline" class="close"></ion-icon>
                    </button>
                </div>
            </div>
        </div>
    </header>
    <main>
        <article>
            <section class="section hero" id="home" aria-label="home" style="background-image:url(.png);">
                <div class="container">
                    <div class="hero-content">
                        <p class="hero-subtitle" data-aos="zoom-in-right" data-aos-duration="1000" data-aos-delay="900">Fighting spirit</p>
                        <h1 class="hero-title h1" data-aos="fade-right" data-aos-duration="1000" data-aos-delay="1100">Create <span class="span">Greet</span> Fighter</h1>
                        <p class="hero-text" data-aos="fade-left" data-aos-duration="1000" data-aos-delay="1300">
                           Build Yourself as a weapons master, and create your own weapons to fight against the enemies. You can also create your own character and customize it as you like.
                        </p>
                        <button class="btn skewBg" id="adminGateButton" data-aos="zoom-out" data-aos-duration="1000" data-aos-delay="1500">User Gate</button>
                    </div>
                    <figure class="hero-banner img-holder" >
                        <img  src="Source/HERO.png" alt="hero-banner" class="w-100" data-aos="zoom-in-left" data-aos-duration="2500">
                    </figure>
                </div>
            </section>
            <section id="UserAccess">
                <h2>Admin Access</h2>
                <form id="adminLoginForm">
                    <input type="text" id="adminUsername" placeholder="Enter Username" required>
                    <input type="password" id="adminPassword" placeholder="Enter Password" required>
                    <button id="adminLoginButton">Login</button>
                </form>
                <div id="adminNotification" class="notification"></div>
            </section>
        </article>
    </main>
    <script>
        (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="4UBJmL8hUTC8LBfKIJ0Vp";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
        </script>
    <script src="admin-SECRET/js/admin-script.js" defer></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init({ offset: 0 });
    </script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
