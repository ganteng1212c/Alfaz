<!DOCTYPE html>
<html lang="en">
<head>    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Galleries</title>
    <link rel="icon" href="../../admin-SECRET/source/logo.png" type="image/png">
    <link rel="stylesheet" href="../../admin-SECRET/css/admin-galleries.css">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    </head>
</head>
<body> 
    <header>
        <h1 class="title">Welcome To our Journey</h1>
    </header>
    <div class="gallery-container">
        <div class="folders">
            <div class="folder" onclick="navigateToFolder('../../admin-SECRET/html/admin-media.html')">
                <div class="folder-image" style="background-image: url('../Source/logo.png');"></div>
                <div class="folder-content">
                    <p>2025</p>
                </div>
            </div>
            <div class="folder" onclick="navigateToFolder('../admin-SECRET/html/admin-media1.html')">
                <div class="folder-image" style="background-image: url('../images/default2.jpg');"></div>
                <div class="folder-content">
                    <p>2026</p>
                </div>
            </div>
            <div class="folder" onclick="navigateToFolder('../../admin-SECRET/html/admin-media2.html')">
                <div class="folder-image" style="background-color: #ff0000;"></div>
                <div class="folder-content">
                    <p>2027</p>
                </div>
            </div>
        </div>
        <button id="addFolderButton" class="add-folder-btn">Tambah Folder</button>
        <div id="folderPopup" class="popup hidden">
            <div class="popup-content">
                <h2>Masukkan Nama Folder</h2>
                <input type="text" id="folderNameInput" placeholder="Nama Folder">
                <button id="confirmFolderButton">Tambah</button>
                <button id="cancelFolderButton">Batal</button>
            </div>
        </div>
    </div>
    <script src="../../admin-SECRET/js/admin-galleries.js" defer></script>
</body>
</html>
