<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Media</title>
    <link rel="stylesheet" href="../../admin-SECRET/css/admin-media.css">
    <link rel="icon" href="../../admin-SECRET/source/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <!-- Loading spinner CSS -->
    <style>
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #0056b3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>    <!-- Cloudinary SDK -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cloudinary-core/2.13.0/cloudinary-core-shrinkwrap.min.js"></script>
    
    <!-- Initialize Cloudinary -->
    <script type="module">
        import { uploadFile, deleteFile, validateFile, getMediaList, cloudinaryConfig } from '../../JS/cloudinary-config.js';
        
        // Initialize Cloudinary
        const cloudinary = new cloudinary.Cloudinary({
            cloud_name: 'dr3uip0uu',
            secure: true
        });
        
        // Make Cloudinary functions available globally
        window.uploadFile = uploadFile;
        window.deleteFile = deleteFile;
        window.validateFile = validateFile;
        window.getMediaList = getMediaList;
        window.cloudinaryConfig = cloudinaryConfig;
        window.cloudinary = cloudinary;
    </script>    <header>
        <div class="header-bar">
            <h1 class="title">Media Gallery</h1>
            <div class="header-actions">
                <input type="file" id="fileInput" accept="image/*, video/*" style="display: none;" multiple>
                <button id="uploadBtn" class="upload-btn">Upload Files</button>
                <button id="deleteBtn" class="delete-btn" style="display: none;">Delete Selected</button>
                <button id="selectBtn" class="select-btn">Select Files</button>
            </div>
        </div>
    </header><!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div class="gallery-container">
        <div class="media-grid" id="mediaGrid">
            <!-- Media items will be loaded dynamically -->
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="previewModal" class="modal">
        <span class="close">&times;</span>
        <div class="modal-content">
            <div id="previewMedia"></div>
            <a id="downloadBtn" class="download-btn" download>Download</a>
        </div>
    </div>    <script type="module" src="../js/admin-media.js"></script>
            <div class="media-item" onclick="openPreview('video', 'https://www.w3schools.com/html/movie.mp4')">
                <video src="https://www.w3schools.com/html/movie.mp4" muted></video>
                <p>Video 2</p>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="preview-modal" id="previewModal">
        <div class="preview-content">
            <span class="close-btn" onclick="closePreview()">&times;</span>
            <div id="previewMedia"></div>
            <a id="downloadBtn" class="download-btn" target="_blank">
                <img src="https://img.icons8.com/?size=100&id=108635&format=png&color=000000" alt="Download Icon">
            </a>
        </div>
    </div>
        <button id="uploadButton" class="upload-btn">
            <img src="../../Source/upload.png" alt="Upload Icon" style="width: 30px; height: 30px;">
            Upload
        </button>
        <div class="modal" id="uploadModal">
            <h2>Upload Media</h2>
            <form id="uploadForm">
                <input type="file" id="mediaFile" accept="image/*,video/*" required>
                <button type="button" id="previewButton">Preview</button>
                <div id="previewSection"></div>
                <input type="text" id="mediaTitle" placeholder="Enter Title" required>
                <button type="submit">Submit</button>
            </form>
        </div>
    </main>    <!-- Custom Scripts -->
    <script src="../../admin-SECRET/js/admin-media.js"></script>
</body>
</html>
