<!DOCTYPE html>
<html lang="en">
<head>    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Media</title>
    <link rel="stylesheet" href="../../admin-SECRET/css/admin-media.css">
    <link rel="icon" href="../../admin-SECRET/source/logo.png" type="ib
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-bar">
            <h1 class="title">Media Gallery</h1>
        </div>
    </header>
    <div class="gallery-container">
        <div class="media-grid">
            <!-- Foto Thumbnail -->
            <div class="media-item" onclick="openPreview('photo', 'https://images.unsplash.com/photo-1700529043649-a04da2914062?q=80&w=2071&auto=format&fit=crop')">
                <img src="https://images.unsplash.com/photo-1700529043649-a04da2914062?q=80&w=2071&auto=format&fit=crop" alt="Photo 1">
                <p>Photo 1</p>
            </div>
            <div class="media-item" onclick="openPreview('photo', 'https://images.unsplash.com/photo-1641893588018-b958a5845cab?q=80&w=2070&auto=format&fit=crop')">
                <img src="https://images.unsplash.com/photo-1641893588018-b958a5845cab?q=80&w=2070&auto=format&fit=crop" alt="Photo 2">
                <p>Photo 2</p>
            </div>
            <!-- Video Thumbnail -->
            <div class="media-item" onclick="openPreview('video', 'https://www.w3schools.com/html/mov_bbb.mp4')">
                <video src="https://www.w3schools.com/html/mov_bbb.mp4" muted></video>
                <p>Video 1</p>
            </div>
            <div class="media-item" onclick="openPreview('video', 'https://www.w3schools.com/html/movie.mp4')">
                <video src="https://www.w3schools.com/html/movie.mp4" muted></video>
                <p>Video 2</p>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="preview-modal" id="previewModal">
        <div class="preview-content">
            <span class="close-btn" onclick="closePreview()">&times;</span>
            <div id="previewMedia"></div>
            <a id="downloadBtn" class="download-btn" target="_blank">
                <img src="https://img.icons8.com/?size=100&id=108635&format=png&color=000000" alt="Download Icon">
            </a>
        </div>
    </div>
        <button id="uploadButton" class="upload-btn">
            <img src="../../Source/upload.png" alt="Upload Icon" style="width: 30px; height: 30px;">
            Upload
        </button>
        <div class="modal" id="uploadModal">
            <h2>Upload Media</h2>
            <form id="uploadForm">
                <input type="file" id="mediaFile" accept="image/*,video/*" required>
                <button type="button" id="previewButton">Preview</button>
                <div id="previewSection"></div>
                <input type="text" id="mediaTitle" placeholder="Enter Title" required>
                <button type="submit">Submit</button>
            </form>
        </div>
    </main>
    <script src="../../admin-SECRET/js/admin-media.js"></script>
</body>
</html>
